<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="config.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'fade-out': 'fadeOut 0.3s ease-in forwards',
                        'twinkle': 'twinkle 2s ease-in-out infinite',
                        'cloud-move': 'cloudMove 10s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(100%)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        fadeOut: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0' },
                        },
                        twinkle: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.5', transform: 'scale(0.8)' },
                        },
                        cloudMove: {
                            '0%': { transform: 'translateX(0)' },
                            '50%': { transform: 'translateX(5px)' },
                            '100%': { transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { transition: background 0.5s ease-in-out; }
        .bg-light-mode { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .bg-dark-mode { background: radial-gradient(circle at 50% -20%, #2e1065 0%, #020617 100%); }
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .sky-switch {
            position: relative;
            width: 80px;
            height: 40px;
            border-radius: 999px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.5);
            transition: all 0.5s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .sky-bg {
            position: absolute;
            inset: 0;
            transition: opacity 0.5s ease;
        }
        .sky-day { background: #60a5fa; opacity: 1; }
        .sky-night { background: #0f172a; opacity: 0; }
        .dark .sky-day { opacity: 0; }
        .dark .sky-night { opacity: 1; }
        .orb {
            position: absolute;
            top: 4px;
            left: 5px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55), background 0.5s;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .orb { background: #fbbf24; } 
        .dark .orb { 
            transform: translateX(40px); 
            background: #e2e8f0; 
            box-shadow: inset -3px -2px 0 0 #94a3b8;
        }
        .scenery-element {
            position: absolute;
            border-radius: 50%;
            transition: all 0.5s ease;
        }
        .cloud { background: #fff; opacity: 0.8; }
        .dark .cloud { transform: translateY(20px); opacity: 0; } 
        .star { background: #fff; opacity: 0; }
        .dark .star { opacity: 0.9; }
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content-active { transform: scale(1) !important; }
    </style>
</head>
<body class="bg-dark-mode min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-500">

    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute top-10 left-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float"></div>
        <div class="absolute top-20 right-10 w-72 h-72 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-8 left-1/2 w-80 h-80 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float" style="animation-delay: 4s;"></div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <div id="confirmModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="confirmModalContent" class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-gray-700 shadow-2xl p-8 rounded-2xl max-w-sm w-full mx-4 transform scale-90 transition-all duration-300">
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mb-4 text-red-500">
                    <i class="ph ph-trash text-3xl"></i>
                </div>
                <h3 class="text-2xl font-bold mb-2 text-gray-900 dark:text-white">Delete Task?</h3>
                <p class="text-gray-600 dark:text-gray-400 mb-8 leading-relaxed">
                    Are you sure you want to remove this task? <br>
                    <span class="text-xs text-red-500 font-semibold uppercase tracking-wider">This action cannot be undone.</span>
                </p>
                <div class="flex gap-4 w-full">
                    <button onclick="closeModal()" class="flex-1 px-4 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors font-semibold">
                        Cancel
                    </button>
                    <button id="confirmDeleteBtn" class="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-red-500 to-red-600 text-white shadow-lg shadow-red-500/40 hover:from-red-600 hover:to-red-700 transform hover:-translate-y-0.5 transition-all font-semibold">
                        Yes, Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-4xl relative z-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-300 dark:to-purple-400">
                    Task<span class="font-light text-gray-700 dark:text-gray-200">Flow</span>
                </h1>
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-2 tracking-wide uppercase">Student Productivity Hub</p>
            </div>

            <div class="sky-switch" onclick="toggleTheme()" title="Toggle Theme">
                <div class="sky-bg sky-day"></div>
                <div class="sky-bg sky-night"></div>
                <div class="orb"></div>
                <div class="scenery-element cloud w-4 h-4 top-2 left-10 animate-cloud-move"></div>
                <div class="scenery-element cloud w-6 h-6 top-4 left-14 animate-cloud-move" style="animation-delay: 1s;"></div>
                <div class="scenery-element cloud w-3 h-3 top-6 left-9 animate-cloud-move" style="animation-delay: 2s;"></div>
                <div class="scenery-element star w-1 h-1 top-2 left-3 animate-twinkle"></div>
                <div class="scenery-element star w-1.5 h-1.5 top-5 left-5 animate-twinkle" style="animation-delay: 0.5s;"></div>
                <div class="scenery-element star w-1 h-1 top-3 left-8 animate-twinkle" style="animation-delay: 1.5s;"></div>
            </div>
        </header>

        <div class="glass-panel rounded-2xl p-2 mb-10 transform hover:scale-[1.01] transition-all duration-300">
            <div class="relative flex items-center bg-white/40 dark:bg-slate-800/40 rounded-xl p-2">
                <i class="ph ph-pencil-simple absolute left-5 text-indigo-500 text-xl"></i>
                <input type="text" id="taskInput" 
                    class="w-full bg-transparent border-none outline-none text-lg py-3 pl-10 pr-32 text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 font-medium"
                    placeholder="Add a new homework task..."
                    onkeypress="handleEnter(event)">
                
                <button onclick="addTask()" 
                    class="absolute right-1 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-semibold transition-all shadow-lg shadow-indigo-500/30 flex items-center gap-2 active:scale-95">
                    <span>Add</span> <i class="ph ph-plus-bold"></i>
                </button>
            </div>
        </div>

        <div class="mb-6 flex justify-between items-end border-b border-gray-200 dark:border-gray-700 pb-2">
            <h3 class="text-xl font-bold flex items-center gap-2 text-gray-700 dark:text-gray-200">
                <i class="ph ph-list-checks text-indigo-500 text-2xl"></i> Current Tasks
            </h3>
            <span id="taskCount" class="text-xs font-mono font-bold bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 px-3 py-1.5 rounded-full border border-indigo-200 dark:border-indigo-500/30">0 Tasks</span>
        </div>

        <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const html = document.documentElement;
        const body = document.body;
        
        function toggleTheme() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                body.classList.remove('bg-dark-mode'); body.classList.add('bg-light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                body.classList.remove('bg-light-mode'); body.classList.add('bg-dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'light') {
            toggleTheme(); 
        } else {
            if(!html.classList.contains('dark')) toggleTheme();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'ph-check-circle' : 'ph-warning-circle';
            const colorClass = type === 'success' ? 'text-emerald-500' : 'text-rose-500';
            const borderClass = type === 'success' ? 'border-emerald-500' : 'border-rose-500';

            toast.className = `pointer-events-auto glass-panel pl-4 pr-6 py-4 rounded-xl flex items-center gap-3 shadow-xl animate-slide-in-right border-l-[6px] ${borderClass} min-w-[320px] bg-white/80 dark:bg-slate-900/80 backdrop-blur-md`;
            toast.innerHTML = `
                <i class="ph ${icon} ${colorClass} text-2xl"></i>
                <div>
                    <h4 class="font-bold text-sm ${colorClass} uppercase tracking-wider">${type}</h4>
                    <p class="text-sm font-medium text-gray-700 dark:text-gray-200">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('animate-slide-in-right');
                toast.classList.add('animate-fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let taskToDeleteId = null;
        const modal = document.getElementById('confirmModal');
        const modalContent = document.getElementById('confirmModalContent');
        const confirmBtn = document.getElementById('confirmDeleteBtn');

        function openDeleteModal(id) {
            taskToDeleteId = id;
            modal.classList.add('modal-active');
            modalContent.classList.add('modal-content-active');
        }

        function closeModal() {
            modal.classList.remove('modal-active');
            modalContent.classList.remove('modal-content-active');
            setTimeout(() => { taskToDeleteId = null; }, 300);
        }

        confirmBtn.addEventListener('click', () => {
            if (taskToDeleteId) {
                performDelete(taskToDeleteId);
                closeModal();
            }
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('DOMContentLoaded', loadTasks);
        function handleEnter(e) { if (e.key === 'Enter') addTask(); }
        function updateCount(count) { document.getElementById('taskCount').innerText = `${count} ${count === 1 ? 'Task' : 'Tasks'}`; }
        function getLocalTasks() { return JSON.parse(localStorage.getItem('studentTasks')) || []; }
        function saveLocalTasks(tasks) { localStorage.setItem('studentTasks', JSON.stringify(tasks)); }

        // --- UPDATED API CALLS ---

        async function loadTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '<div class="col-span-full flex justify-center py-10"><i class="ph ph-spinner animate-spin text-4xl text-indigo-500"></i></div>';
            try {
                // Modified to use API_BASE_URL
                const res = await fetch(`${API_BASE_URL}/api/tasks/`);
                if(!res.ok) throw new Error("API Offline");
                const data = await res.json();
                renderTasks(data);
            } catch (err) {
                console.log("Using Local Storage Mode");
                renderTasks(getLocalTasks());
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = ''; 
            updateCount(tasks.length);
            if(tasks.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-500 dark:text-gray-400 glass-panel rounded-2xl border-dashed border-2 border-gray-300 dark:border-gray-600">
                        <i class="ph ph-coffee text-5xl mb-3 block opacity-50"></i>
                        <p class="text-lg font-medium">All caught up!</p>
                        <p class="text-sm">No homework tasks pending.</p>
                    </div>`;
                return;
            }
            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = 'glass-panel p-5 rounded-xl flex justify-between items-center animate-slide-up group hover:bg-white/30 dark:hover:bg-slate-700/50 transition-colors border-l-4 border-transparent hover:border-indigo-500';
                div.style.animationDelay = `${index * 0.05}s`;
                div.innerHTML = `
                    <div class="flex items-center gap-4 w-full overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0">
                            <i class="ph ph-notebook text-xl"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-lg leading-tight truncate text-gray-800 dark:text-gray-100">${task.title}</p>
                            <span class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 flex items-center gap-1">
                                <i class="ph ph-clock"></i> Pending
                            </span>
                        </div>
                    </div>
                    <button onclick="openDeleteModal('${task.id}')" class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-all opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0">
                        <i class="ph ph-trash text-xl"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const title = input.value.trim();
            if (!title) return showToast("Please enter a task name", "error");
            input.value = ''; 
            try {
                // Modified to use API_BASE_URL
                const res = await fetch(`${API_BASE_URL}/api/add/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title })
                });
                if(res.ok) {
                    loadTasks();
                    showToast("Task added successfully!");
                } else { throw new Error("API Error"); }
            } catch (err) {
                const tasks = getLocalTasks();
                tasks.push({ id: Date.now(), title: title });
                saveLocalTasks(tasks);
                loadTasks();
                showToast("Task saved locally!");
            }
        }

        async function performDelete(id) {
            try {
                // Modified to use API_BASE_URL
                const res = await fetch(`${API_BASE_URL}/api/delete/${id}/`, { method: 'DELETE' });
                if(res.ok) {
                    loadTasks();
                    showToast("Task deleted successfully!");
                } else { throw new Error("API Error"); }
            } catch (err) {
                let tasks = getLocalTasks();
                tasks = tasks.filter(t => t.id != id);
                saveLocalTasks(tasks);
                loadTasks();
                showToast("Task deleted locally!");
            }
        }
    </script>
</body>
</html>
